# mailcow-mcp next to mailcow. A separate compose project (e.g. /opt/mailcow-mcp): mailcow's own
# compose files are never touched, so mailcow's update.sh is unaffected.
#
# Generated settings live in .env (compose variables), app.env and broker.env; create them with
# setup-mailcow.sh. See docs/deploy-mailcow.md.

name: mailcow-mcp

x-hardening: &hardening
  image: ghcr.io/nitramxx/mailcow-mcp:${MCP_VERSION:-latest}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m
  pids_limit: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  # IPv4 only: mailcow's API allowlist and Fail2ban allowlist name the fixed IPv4 addresses.
  # On a dual-stack mailcow network the containers would otherwise also get (changing) IPv6
  # addresses and connect from those.
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 1
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  app:
    <<: *hardening
    command: ["serve"]
    env_file: app.env
    mem_limit: 1g  # parsing and rendering mail; one runaway request can't take mailcow down
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "mailcow-mcp", "healthcheck", "--port", "8090"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      mailcow:
        # Fixed: mailcow's Fail2ban whitelist names this address.
        ipv4_address: ${APP_IP:?run setup-mailcow.sh --apply first (it writes .env)}
        aliases:
          - mailcow-mcp
      internal: {}

  broker:
    <<: *hardening
    command: ["broker"]
    env_file: broker.env
    mem_limit: 256m
    environment:
      # Listen only on the internal network: nothing on mailcow's network can reach it.
      HOST: ${BROKER_INTERNAL_IP:-172.31.253.11}
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "mailcow-mcp", "healthcheck", "--port", "8091"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      mailcow:
        # Fixed: mailcow's "Allow API access from" names this address.
        ipv4_address: ${BROKER_IP:?run setup-mailcow.sh --apply first (it writes .env)}
      internal:
        ipv4_address: ${BROKER_INTERNAL_IP:-172.31.253.11}
        # Only on this network (the service name "broker" resolves on both).
        aliases:
          - mcp-broker

volumes:
  app-data:
  broker-data:

networks:
  mailcow:
    external: true
    name: ${MAILCOW_NETWORK:-mailcowdockerized_mailcow-network}
  internal:
    # Only app and broker; no route out.
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.31.253.0/24}
