[project]
name = "mailcow-mcp"
version = "0.0.0"
description = "Self-hosted remote MCP server for mailcow: send, draft, read and follow up on email from any MCP client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=46",
    "mcp>=2.2,<3",
    "starlette>=1.0",
    "uvicorn>=0.40",
]

[project.scripts]
mailcow-mcp = "mailcow_mcp.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.0",
    "pytest>=9.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailcow_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
