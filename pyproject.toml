[project]
name = "mailcow-mcp"
version = "0.1.5"
description = "Self-hosted remote MCP server for mailcow: send, draft, read and follow up on email from any MCP client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "anyio>=4.15.1",
    "cryptography>=46",
    "httpx>=0.28.1",
    "imapclient>=4.1.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=2.2,<3",
    "nh3>=0.3.7",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "starlette>=1.0",
    "tzdata>=2026.4",
    "uvicorn>=0.40",
    "weasyprint>=70.0",
]

[project.scripts]
mailcow-mcp = "mailcow_mcp.cli:main"

[dependency-groups]
dev = [
    "a2wsgi>=1.10.10",
    "aiosmtpd>=1.4.6",
    "httpx>=0.28",
    "mypy>=2.0",
    "pytest>=9.0",
    "radicale>=3.8.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailcow_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# The formatter wraps code; long SQL and message strings are fine.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mailcow_mcp"]
known-local-folder = ["conftest", "mailserver_fixture"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["imapclient", "imapclient.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs Docker (real Dovecot + Postfix test server)",
    "kit: deployment kit tests (Docker; builds the image)",
]
filterwarnings = ["ignore::DeprecationWarning:radicale.*"]
